<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Taiwanese Baseball Player Watch</title>
<style>
  body { font-family: system-ui, sans-serif; margin: 2rem auto; max-width: 60rem; padding: 0 1rem; }
  h1 { font-size: 1.4rem; }
  h2 { font-size: 1.1rem; margin-top: 2rem; }
  table { border-collapse: collapse; width: 100%; font-size: 0.85rem; }
  th, td { border: 1px solid #ccc; padding: 0.3rem 0.5rem; text-align: left; }
  th { background: #f4f4f4; }
  .missing { color: #999; }
  #status { margin-left: 0.75rem; font-size: 0.85rem; color: #555; }
  button { padding: 0.4rem 0.8rem; }
</style>
</head>
<body>
<h1>Taiwanese Baseball Player Watch</h1>
<p>Plate-appearance event monitoring. Replay is idempotent — run it twice and nothing is duplicated.</p>

<button id="replay">Run historical replay</button><span id="status"></span>

<h2>Players</h2>
<div id="players"></div>

<h2>Alerts</h2>
<div id="alerts"></div>

<h2>Plate appearances</h2>
<div id="events"></div>

<script>
const cell = (value) =>
  value === null || value === undefined
    ? '<td class="missing">—</td>'
    : `<td>${String(value)}</td>`;

function renderTable(target, columns, rows) {
  const node = document.getElementById(target);
  if (!rows.length) {
    node.innerHTML = '<p class="missing">Nothing yet.</p>';
    return;
  }
  const head = columns.map((c) => `<th>${c}</th>`).join('');
  const body = rows
    .map((row) => `<tr>${columns.map((c) => cell(row[c])).join('')}</tr>`)
    .join('');
  node.innerHTML = `<table><thead><tr>${head}</tr></thead><tbody>${body}</tbody></table>`;
}

async function refresh() {
  const [players, alerts, events] = await Promise.all([
    fetch('/api/players').then((r) => r.json()),
    fetch('/api/alerts').then((r) => r.json()),
    fetch('/api/events').then((r) => r.json()),
  ]);
  renderTable('players', ['id', 'external_player_id', 'name', 'team'], players);
  renderTable('alerts', ['id', 'rule_type', 'message', 'plate_appearance_id'], alerts);
  renderTable(
    'events',
    ['game_id', 'at_bat_index', 'inning', 'result', 'pitcher', 'pitch_type',
     'pitch_velocity', 'exit_velocity', 'launch_angle'],
    events
  );
}

document.getElementById('replay').addEventListener('click', async () => {
  const status = document.getElementById('status');
  status.textContent = 'replaying…';
  try {
    const report = await fetch('/api/replay', { method: 'POST' }).then((r) => r.json());
    status.textContent =
      `read ${report.events_read} · stored ${report.stored} · duplicates ${report.duplicates}` +
      ` · ignored ${report.ignored_incomplete} · alerts ${report.alerts_created}`;
    await refresh();
  } catch (error) {
    status.textContent = `failed: ${error}`;
  }
});

refresh();
</script>
</body>
</html>
